name: PR

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Type check
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      - name: Test the frameworks pages, the application heatmap and the framework layer of the vulnerabilities
        run: |
          yarn --cwd plugins/sbom-backend test
          yarn --cwd plugins/console test src/components/frameworks

      - name: Test the assistants and the continuity portal
        run: |
          yarn --cwd plugins/ops-assistant-backend test
          yarn --cwd plugins/continuity-backend test
          yarn --cwd packages/app test src/components/opsassistant src/components/cost src/components/scaffolder

      - name: Test the data view, the Grafana tabs, the monitoring page, the business types and the paths of the console
        run: |
          yarn --cwd plugins/datahub-backend test src/application
          yarn --cwd packages/backend test src/plugins/manageModel src/plugins/businessMap
          yarn --cwd plugins/console test src/components/EntityData src/components/EntityGrafana src/components/monitoringModel src/components/manage src/components/classifyTypes src/components/businessService src/components/depsModel src/components/businessMap src/pages src/paths

      - name: Test the interconnection, the segregations and the architecture views of the console
        run: |
          yarn --cwd packages/backend test src/plugins/clusterInfra src/plugins/clusterVms src/plugins/clusterZone
          yarn --cwd plugins/console test src/interconnection src/components/clusterArchModel src/components/Interconnection src/components/InfraPages src/components/ClusterOverviewPage

      - name: Build backend
        run: yarn build:backend
