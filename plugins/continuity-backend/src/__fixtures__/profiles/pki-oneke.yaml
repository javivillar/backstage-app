service: pki-oneke
title: Platform PKI (step-ca)
tier: A
lifecycle: supported
status: approved
approvedBy: continuity-officer
approvedAt: "2026-11-07"
records:
  - id: issued
    title: Issued certificates log
    kind: record
    retention: 10 years
    export: { method: step-ca db dump, format: JSONL + hash chain, schedule: daily, workflow: continuity-export-step-ca }
    worm: true
trustAnchors:
  - id: platform-root-ca
    title: Platform root CA (step-ca)
    kind: ca
    probe: "configmap:pki-oneke/step-ca-certs/root_ca.crt"
  - id: platform-intermediate-ca
    title: Platform intermediate CA
    kind: ca
    probe: "configmap:pki-oneke/step-ca-certs/intermediate_ca.crt"
exit:
  alternative: Any X.509 CA
  exportFormat: PEM
  upstream: { project: step-ca, license: Apache-2.0 }
